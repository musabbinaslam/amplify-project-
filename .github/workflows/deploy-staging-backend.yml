# Verifies release SHA after Hostinger backend deploy (stamp runs on server via postinstall).

name: Deploy Staging Backend

on:
  push:
    branches:
      - staging
      - TEST
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-staging-backend.yml'

concurrency:
  group: staging-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stamp-release:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Hostinger git deploy
        env:
          WAIT_SECONDS: ${{ vars.STAGING_DEPLOY_WAIT_SECONDS || '120' }}
        run: sleep "$WAIT_SECONDS"

      - name: Verify release endpoint
        env:
          API_URL: ${{ vars.STAGING_API_URL || 'https://testapi.callsflow.io' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            [ "$i" -gt 1 ] && sleep 10
            BODY=$(curl -sS --max-time 15 -A "Mozilla/5.0 (compatible; CallsFlowDeploy/1.0)" \
              "$API_URL/api/public/release?t=$(date +%s)" 2>/dev/null || echo '{}')
            echo "$BODY"
            echo "$BODY" | grep -qE "\"releaseId\"[[:space:]]*:[[:space:]]*\"$RELEASE_ID\"" && exit 0
          done
          exit 1
