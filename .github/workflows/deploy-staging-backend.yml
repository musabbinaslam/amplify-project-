# Stamps backend/.release when backend/** changes on staging/TEST.
# Hostinger git deploy handles code + npm — this workflow only syncs the release SHA.
#
# For ALL pushes (including frontend-only), use "Stamp Staging Backend Release" instead.
#
# Secrets: STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY, STAGING_BACKEND_PATH
# Optional: STAGING_SSH_PORT

name: Deploy Staging Backend

on:
  push:
    branches:
      - staging
      - TEST
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-staging-backend.yml'

concurrency:
  group: staging-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stamp-release:
    runs-on: ubuntu-latest
    steps:
      - name: Stamp .release on Hostinger
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          BACKEND_PATH: ${{ secrets.STAGING_BACKEND_PATH }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')"
          BACKEND_PATH="$(printf '%s' "$BACKEND_PATH" | tr -d '[:space:]')"

          test -n "$SSH_HOST" || (echo "::error::Missing STAGING_SSH_HOST" && exit 1)
          test -n "$SSH_USER" || (echo "::error::Missing STAGING_SSH_USER" && exit 1)
          test -n "$SSH_KEY"  || (echo "::error::Missing STAGING_SSH_KEY" && exit 1)
          test -n "$BACKEND_PATH" || (echo "::error::Missing STAGING_BACKEND_PATH" && exit 1)

          case "$SSH_HOST" in
            *"://"* ) echo "::error::STAGING_SSH_HOST must be IP only — no https://" && exit 1 ;;
          esac

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "→ Stamping $RELEASE_ID (Hostinger git deploy handles code)"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             mkdir -p '$BACKEND_PATH'
             printf '%s\n' '$RELEASE_ID' > '$BACKEND_PATH/.release'
             cat '$BACKEND_PATH/.release'"

      - name: Verify release endpoint
        env:
          API_URL: ${{ vars.STAGING_API_URL || 'https://testapi.callsflow.io' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          sleep 3
          BODY=$(curl -fsS "$API_URL/api/public/release?t=$(date +%s)" || echo '{}')
          echo "$BODY"
          if echo "$BODY" | grep -q "$RELEASE_ID"; then
            echo "✓ Backend release matches deploy SHA"
          else
            echo "::warning::API does not report $RELEASE_ID yet — check STAGING_BACKEND_PATH"
          fi
