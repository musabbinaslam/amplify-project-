# Waits for Hostinger deploy, then verifies /api/public/release matches the push SHA.
# Stamping happens ON THE SERVER during npm postinstall + server start (no SSH/CDN issues).
# Optional HTTPS stamp if RELEASE_STAMP_TOKEN is set and CDN allows GitHub IPs.

name: Stamp Production Backend Release

on:
  push:
    branches:
      - main

concurrency:
  group: stamp-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Hostinger git deploy
        env:
          WAIT_SECONDS: ${{ vars.PROD_DEPLOY_WAIT_SECONDS || '120' }}
        run: |
          echo "Waiting ${WAIT_SECONDS}s for Hostinger npm postinstall to write .release..."
          sleep "$WAIT_SECONDS"

      - name: Try HTTPS stamp (optional — CDN may block GitHub)
        continue-on-error: true
        env:
          API_URL: ${{ vars.PROD_API_URL || 'https://api.callsflow.io' }}
          STAMP_TOKEN: ${{ secrets.PROD_RELEASE_STAMP_TOKEN }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          if [ -z "$STAMP_TOKEN" ]; then echo "No PROD_RELEASE_STAMP_TOKEN — skipping"; exit 0; fi
          HTTP=$(curl -sS -o /tmp/stamp.json -w "%{http_code}" --max-time 20 \
            -A "Mozilla/5.0 (compatible; CallsFlowDeploy/1.0)" \
            -X POST "$API_URL/api/public/release/stamp" \
            -H "Content-Type: application/json" \
            -H "X-Release-Stamp-Token: $STAMP_TOKEN" \
            -d "{\"releaseId\":\"$RELEASE_ID\"}" 2>/dev/null || echo "000")
          cat /tmp/stamp.json 2>/dev/null || true
          echo "HTTPS stamp HTTP $HTTP (ignored if CDN blocked)"

      - name: Verify release endpoint
        env:
          API_URL: ${{ vars.PROD_API_URL || 'https://api.callsflow.io' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            if [ "$i" -gt 1 ]; then sleep 10; fi
            BODY=$(curl -sS --max-time 15 -A "Mozilla/5.0 (compatible; CallsFlowDeploy/1.0)" \
              "$API_URL/api/public/release?t=$(date +%s)" 2>/dev/null || echo '{}')
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -qE "\"releaseId\"[[:space:]]*:[[:space:]]*\"$RELEASE_ID\""; then
              echo "✓ Backend API reports $RELEASE_ID"
              exit 0
            fi
          done
          echo "::error::API still not on $RELEASE_ID after ~3 min."
          echo "::error::Check Hostinger deploy logs for [release] Wrote .release"
          exit 1
