# Waits for Hostinger deploy; release stamped on server via npm postinstall (not HTTPS).

name: Stamp Production Backend Release

on:
  push:
    branches:
      - main

concurrency:
  group: stamp-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Hostinger git deploy
        env:
          WAIT_SECONDS: ${{ vars.PROD_DEPLOY_WAIT_SECONDS || '120' }}
        run: |
          echo "Waiting ${WAIT_SECONDS}s for Hostinger npm postinstall to write .release..."
          sleep "$WAIT_SECONDS"

      - name: Verify release endpoint
        env:
          API_URL: ${{ vars.PROD_API_URL || 'https://api.callsflow.io' }}
          RELEASE_ID: ${{ github.sha }}
        run: bash .github/scripts/verify-release-endpoint.sh "$API_URL" "$RELEASE_ID"
