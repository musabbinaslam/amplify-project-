# Stamps backend/.release on staging via HTTPS — no SSH needed.
#
# Setup:
#   1. Hostinger env: RELEASE_STAMP_TOKEN=<random secret>
#   2. GitHub secret: STAGING_RELEASE_STAMP_TOKEN=<same value>
# Optional: STAGING_API_URL, STAGING_DEPLOY_WAIT_SECONDS

name: Stamp Staging Backend Release

on:
  push:
    branches:
      - staging
      - TEST

concurrency:
  group: stamp-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Hostinger git deploy
        env:
          WAIT_SECONDS: ${{ vars.STAGING_DEPLOY_WAIT_SECONDS || '120' }}
        run: |
          echo "Waiting ${WAIT_SECONDS}s for Hostinger to finish git deploy..."
          sleep "$WAIT_SECONDS"

      - name: Check if API already reports this release
        id: precheck
        env:
          API_URL: ${{ vars.STAGING_API_URL || 'https://testapi.callsflow.io' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          BODY=$(curl -sS --max-time 20 -A "CallsFlow-GitHub-Actions/1.0" \
            "$API_URL/api/public/release?t=$(date +%s)" 2>/dev/null || echo '{}')
          echo "$BODY"
          if echo "$BODY" | grep -qE "\"releaseId\"[[:space:]]*:[[:space:]]*\"$RELEASE_ID\""; then
            echo "already_stamped=true" >> "$GITHUB_OUTPUT"
            echo "✓ API already reports $RELEASE_ID"
          else
            echo "already_stamped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp release via HTTPS
        if: steps.precheck.outputs.already_stamped != 'true'
        id: http_stamp
        env:
          API_URL: ${{ vars.STAGING_API_URL || 'https://testapi.callsflow.io' }}
          STAMP_TOKEN: ${{ secrets.STAGING_RELEASE_STAMP_TOKEN }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$STAMP_TOKEN" || {
            echo "::error::Add STAGING_RELEASE_STAMP_TOKEN to GitHub secrets"
            echo "::error::Set RELEASE_STAMP_TOKEN to the same value in Hostinger hPanel env for testapi.callsflow.io"
            exit 1
          }
          for attempt in 1 2 3 4 5; do
            echo "HTTPS stamp attempt $attempt/5 ..."
            HTTP=$(curl -sS -o /tmp/stamp_resp.json -w "%{http_code}" --max-time 30 \
              -A "CallsFlow-GitHub-Actions/1.0" \
              -X POST "$API_URL/api/public/release/stamp" \
              -H "Content-Type: application/json" \
              -H "X-Release-Stamp-Token: $STAMP_TOKEN" \
              -d "{\"releaseId\":\"$RELEASE_ID\"}" 2>/dev/null || echo "000")
            cat /tmp/stamp_resp.json 2>/dev/null || true
            echo "HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "✓ Stamped via HTTPS"
              exit 0
            fi
            sleep 10
          done
          echo "::error::HTTPS stamp failed"
          exit 1

      - name: Verify release endpoint
        env:
          API_URL: ${{ vars.STAGING_API_URL || 'https://testapi.callsflow.io' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if [ "$i" -gt 1 ]; then sleep 10; fi
            BODY=$(curl -sS --max-time 15 -A "CallsFlow-GitHub-Actions/1.0" \
              "$API_URL/api/public/release?t=$(date +%s)" 2>/dev/null || echo '{}')
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -qE "\"releaseId\"[[:space:]]*:[[:space:]]*\"$RELEASE_ID\""; then
              echo "✓ Backend API reports $RELEASE_ID"
              exit 0
            fi
          done
          echo "::error::API does not report $RELEASE_ID"
          exit 1
