# Waits for Hostinger deploy. .release is written on the server via npm postinstall + server start.
# GitHub cannot verify the API reliably (Hostinger CDN blocks datacenter IPs).

name: Stamp Staging Backend Release

on:
  push:
    branches:
      - staging
      - TEST

concurrency:
  group: stamp-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Hostinger git deploy
        env:
          WAIT_SECONDS: ${{ vars.STAGING_DEPLOY_WAIT_SECONDS || '120' }}
        run: |
          echo "Waiting ${WAIT_SECONDS}s for Hostinger to pull and run npm postinstall..."
          sleep "$WAIT_SECONDS"
          echo "✓ Done — server writes .release automatically (see Hostinger deploy logs for [release] Wrote .release)"
          echo "Release SHA for this push: ${{ github.sha }}"
