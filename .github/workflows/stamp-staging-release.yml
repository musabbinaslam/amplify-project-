# Stamps backend/.release after Hostinger git deploy catches up (backend deploys after Vercel).
# Auto-finds the Node app directory on Hostinger.
#
# Secrets: STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY
# Optional: STAGING_SSH_PORT, STAGING_BACKEND_PATH (override auto-detect)
# Optional: STAGING_DEPLOY_WAIT_SECONDS (default 180)

name: Stamp Staging Backend Release

on:
  push:
    branches:
      - staging
      - TEST

concurrency:
  group: stamp-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Hostinger git deploy
        env:
          WAIT_SECONDS: ${{ vars.STAGING_DEPLOY_WAIT_SECONDS || '180' }}
        run: |
          echo "Waiting ${WAIT_SECONDS}s for Hostinger to finish git deploy before stamping..."
          sleep "$WAIT_SECONDS"

      - name: Stamp .release on Hostinger
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          BACKEND_PATH: ${{ secrets.STAGING_BACKEND_PATH }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')"
          BACKEND_PATH="$(printf '%s' "${BACKEND_PATH:-}" | tr -d '[:space:]')"

          test -n "$SSH_HOST" || (echo "::error::Missing STAGING_SSH_HOST" && exit 1)
          test -n "$SSH_USER" || (echo "::error::Missing STAGING_SSH_USER" && exit 1)
          test -n "$SSH_KEY"  || (echo "::error::Missing STAGING_SSH_KEY" && exit 1)

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST"

          echo "→ Stamping release $RELEASE_ID"
          $SSH_CMD "set -euo pipefail
            RELEASE_ID='$RELEASE_ID'
            if [ -n '${BACKEND_PATH}' ]; then
              APP_DIR='${BACKEND_PATH}'
            else
              SERVER_FILE=\$(find ~ -name 'server.js' -path '*/nodejs/src/server.js' 2>/dev/null | head -1)
              if [ -z \"\$SERVER_FILE\" ]; then
                SERVER_FILE=\$(find ~ -name 'server.js' -path '*/src/server.js' 2>/dev/null | head -1)
              fi
              if [ -z \"\$SERVER_FILE\" ]; then
                echo 'Could not find src/server.js on server'
                exit 1
              fi
              APP_DIR=\$(dirname \"\$SERVER_FILE\")/..
              APP_DIR=\$(cd \"\$APP_DIR\" && pwd)
            fi
            echo \"App dir: \$APP_DIR\"
            printf '%s\n' \"\$RELEASE_ID\" > \"\$APP_DIR/.release\"
            printf '%s\n' \"\$RELEASE_ID\" > \"\$APP_DIR/../.release\" 2>/dev/null || true
            echo 'Wrote .release:'
            cat \"\$APP_DIR/.release\"
          "

      - name: Verify release endpoint
        env:
          API_URL: ${{ vars.STAGING_API_URL || 'https://testapi.callsflow.io' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            sleep 10
            BODY=$(curl -fsS "$API_URL/api/public/release?t=$(date +%s)" || echo '{}')
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q "$RELEASE_ID"; then
              echo "✓ Backend API reports $RELEASE_ID"
              exit 0
            fi
          done
          echo "::error::API still does not report $RELEASE_ID — remove stale RELEASE_ID env in Hostinger hPanel or fix app path"
          exit 1
