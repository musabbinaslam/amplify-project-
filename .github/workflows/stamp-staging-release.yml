# Waits for Hostinger deploy; release stamped on server via npm postinstall + server start.

name: Stamp Staging Backend Release

on:
  push:
    branches:
      - staging
      - TEST

concurrency:
  group: stamp-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Hostinger git deploy
        env:
          WAIT_SECONDS: ${{ vars.STAGING_DEPLOY_WAIT_SECONDS || '120' }}
        run: |
          echo "Waiting ${WAIT_SECONDS}s for Hostinger npm postinstall to write .release..."
          sleep "$WAIT_SECONDS"

      - name: Try HTTPS stamp (optional — CDN may block GitHub)
        continue-on-error: true
        env:
          API_URL: ${{ vars.STAGING_API_URL || 'https://testapi.callsflow.io' }}
          STAMP_TOKEN: ${{ secrets.STAGING_RELEASE_STAMP_TOKEN }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          if [ -z "$STAMP_TOKEN" ]; then echo "No STAGING_RELEASE_STAMP_TOKEN — skipping"; exit 0; fi
          HTTP=$(curl -sS -o /tmp/stamp.json -w "%{http_code}" --max-time 20 \
            -A "Mozilla/5.0 (compatible; CallsFlowDeploy/1.0)" \
            -X POST "$API_URL/api/public/release/stamp" \
            -H "Content-Type: application/json" \
            -H "X-Release-Stamp-Token: $STAMP_TOKEN" \
            -d "{\"releaseId\":\"$RELEASE_ID\"}" 2>/dev/null || echo "000")
          cat /tmp/stamp.json 2>/dev/null || true
          echo "HTTPS stamp HTTP $HTTP (ignored if CDN blocked)"

      - name: Verify release endpoint
        env:
          API_URL: ${{ vars.STAGING_API_URL || 'https://testapi.callsflow.io' }}
          RELEASE_ID: ${{ github.sha }}
        run: bash .github/scripts/verify-release-endpoint.sh "$API_URL" "$RELEASE_ID"
