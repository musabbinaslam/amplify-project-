# Stamps backend/.release on EVERY staging push so it matches Vercel's commit SHA.
# No pm2 restart — getReleaseId() reads .release from disk on each request.
#
# Required secrets (same as deploy-staging-backend.yml):
#   STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY, STAGING_BACKEND_PATH
# Optional: STAGING_SSH_PORT

name: Stamp Staging Backend Release

on:
  push:
    branches:
      - staging
      - TEST

concurrency:
  group: stamp-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Stamp .release on Hostinger
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          BACKEND_PATH: ${{ secrets.STAGING_BACKEND_PATH }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')"
          BACKEND_PATH="$(printf '%s' "$BACKEND_PATH" | tr -d '[:space:]')"

          test -n "$SSH_HOST" || (echo "::error::Missing STAGING_SSH_HOST secret" && exit 1)
          test -n "$SSH_USER" || (echo "::error::Missing STAGING_SSH_USER secret" && exit 1)
          test -n "$SSH_KEY"  || (echo "::error::Missing STAGING_SSH_KEY secret" && exit 1)
          test -n "$BACKEND_PATH" || (echo "::error::Missing STAGING_BACKEND_PATH secret" && exit 1)

          case "$SSH_HOST" in
            *"://"* ) echo "::error::STAGING_SSH_HOST must be IP or hostname only — remove https://" && exit 1 ;;
          esac
          case "$BACKEND_PATH" in
            /home/* ) ;;
            * ) echo "::error::STAGING_BACKEND_PATH must be full server path starting with /home/ (from SSH: cd to nodejs && pwd)" && exit 1 ;;
          esac

          echo "→ SSH target: ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"
          echo "→ Backend path length: ${#BACKEND_PATH} chars"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "→ Stamping $RELEASE_ID at $BACKEND_PATH/.release"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             mkdir -p '$BACKEND_PATH'
             printf '%s\n' '$RELEASE_ID' > '$BACKEND_PATH/.release'
             echo 'Stamped:' && cat '$BACKEND_PATH/.release'"

      - name: Verify release endpoint
        env:
          API_URL: ${{ vars.STAGING_API_URL || 'https://testapi.callsflow.io' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          sleep 3
          BODY=$(curl -fsS "$API_URL/api/public/release?t=$(date +%s)" || echo '{"error":"unreachable"}')
          echo "$BODY"
          if echo "$BODY" | grep -q "$RELEASE_ID"; then
            echo "✓ Backend release matches deploy SHA"
          else
            echo "::warning::Backend API does not report $RELEASE_ID yet — check SSH path or Hostinger deploy"
          fi
