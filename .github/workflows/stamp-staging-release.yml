# Stamps backend/.release after Hostinger git deploy catches up (backend deploys after Vercel).
#
# Secrets: STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY
# Optional: STAGING_SSH_PORT, STAGING_BACKEND_PATH
# Optional: STAGING_DEPLOY_WAIT_SECONDS (default 120)

name: Stamp Staging Backend Release

on:
  push:
    branches:
      - staging
      - TEST

concurrency:
  group: stamp-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Hostinger git deploy
        env:
          WAIT_SECONDS: ${{ vars.STAGING_DEPLOY_WAIT_SECONDS || '120' }}
        run: |
          echo "Waiting ${WAIT_SECONDS}s for Hostinger to finish git deploy before stamping..."
          sleep "$WAIT_SECONDS"

      - name: Stamp .release on Hostinger
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '65002' }}
          BACKEND_PATH: ${{ secrets.STAGING_BACKEND_PATH || vars.STAGING_BACKEND_PATH || 'domains/testapi.callsflow.io/nodejs' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')"
          BACKEND_PATH="$(printf '%s' "$BACKEND_PATH" | tr -d '[:space:]')"

          test -n "$SSH_HOST" || (echo "::error::Missing STAGING_SSH_HOST" && exit 1)
          test -n "$SSH_USER" || (echo "::error::Missing STAGING_SSH_USER" && exit 1)
          test -n "$SSH_KEY"  || (echo "::error::Missing STAGING_SSH_KEY" && exit 1)

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -p "$SSH_PORT"
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o BatchMode=yes
          )

          echo "→ Testing SSH to $SSH_USER@$SSH_HOST:$SSH_PORT ..."
          timeout 30 ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" 'echo connected'

          echo "→ Stamping release $RELEASE_ID in $BACKEND_PATH"
          timeout 45 ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" bash -s <<REMOTE
          set -euo pipefail
          RELEASE_ID='$RELEASE_ID'
          REL_PATH='$BACKEND_PATH'
          if [ "\${REL_PATH#/}" = "\$REL_PATH" ]; then
            APP_DIR="\$HOME/\$REL_PATH"
          else
            APP_DIR="\$REL_PATH"
          fi
          if [ ! -d "\$APP_DIR" ]; then
            echo "Directory not found: \$APP_DIR" >&2
            exit 1
          fi
          APP_DIR="\$(cd "\$APP_DIR" && pwd)"
          echo "App dir: \$APP_DIR"
          printf '%s\n' "\$RELEASE_ID" > "\$APP_DIR/.release"
          echo 'Wrote .release:'
          cat "\$APP_DIR/.release"
          REMOTE

      - name: Verify release endpoint
        env:
          API_URL: ${{ vars.STAGING_API_URL || 'https://testapi.callsflow.io' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if [ "$i" -gt 1 ]; then sleep 5; fi
            BODY=$(curl -fsS --max-time 15 "$API_URL/api/public/release?t=$(date +%s)" || echo '{}')
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q "$RELEASE_ID"; then
              echo "✓ Backend API reports $RELEASE_ID"
              exit 0
            fi
          done
          echo "::error::API still does not report $RELEASE_ID — check STAGING_BACKEND_PATH"
          exit 1
