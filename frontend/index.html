<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CallsFlow — Inbound Lead Platform</title>
    <meta name="description" content="CallsFlow is a SaaS CRM dialer platform for insurance agents to receive and manage inbound leads in real time." />
    <meta property="og:title" content="CallsFlow — Inbound Lead Platform" />
    <meta property="og:description" content="CallsFlow routes exclusive inbound insurance calls to licensed agents in real time." />
    <meta property="og:site_name" content="CallsFlow" />
<script>
      (function() {
        window.__SPLASH_START__ = Date.now();
        var theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      :root {
        --sp-bg: #0e0e0e;
        --sp-surface: rgba(22, 24, 28, 0.72);
        --sp-border: rgba(255, 255, 255, 0.08);
        --sp-logo: #25f425;
        --sp-shadow: rgba(37, 244, 37, 0.3);
        --sp-track: rgba(255,255,255,0.06);
        --sp-text: rgba(255, 255, 255, 0.88);
        --sp-sub: rgba(255, 255, 255, 0.52);
      }
      [data-theme="light"] {
        --sp-bg: #fafafa;
        --sp-surface: rgba(255, 255, 255, 0.76);
        --sp-border: rgba(0, 0, 0, 0.08);
        --sp-logo: #18a818;
        --sp-shadow: rgba(24, 168, 24, 0.25);
        --sp-track: rgba(0,0,0,0.08);
        --sp-text: rgba(0, 0, 0, 0.86);
        --sp-sub: rgba(0, 0, 0, 0.56);
      }

      /* Instant splash — renders before React JS even loads */
      body { margin: 0; background: var(--sp-bg); }
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: var(--sp-bg);
        transition: opacity 0.35s ease-out;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }

      .splash-shell {
        width: min(360px, calc(100vw - 40px));
        border-radius: 20px;
        padding: 26px 22px 20px;
        background: var(--sp-surface);
        border: 1px solid var(--sp-border);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.28);
      }
      .splash-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }
      .splash-logo-wrap {
        width: 52px;
        height: 98px;
        animation: sp-pulse 2s ease-in-out infinite;
        transform-origin: center center;
        will-change: transform, opacity;
      }
      .splash-logo-img {
        width: 52px;
        height: 98px;
        object-fit: contain;
        object-position: center;
        display: block;
      }
      .splash-copy {
        transform: translateZ(0);
        backface-visibility: hidden;
      }
      .splash-title {
        margin: 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--sp-text);
        line-height: 1.1;
      }
      .splash-subtitle {
        margin: 2px 0 0;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--sp-sub);
      }

      @keyframes sp-pulse {
        0%,100% { opacity:.7; transform:scale(1); }
        50% { opacity:1; transform:scale(1.08); }
      }
      
      #splash .bar-track {
        width: 100%; height: 4px;
        background: var(--sp-track);
        border-radius: 999px; overflow: hidden;
      }
      #splash .bar-fill {
        width: 36%; height: 100%; border-radius: 999px;
        background: var(--sp-logo);
        box-shadow: 0 0 8px var(--sp-shadow);
        animation: sp-slide 1.4s ease-in-out infinite;
      }
      @keyframes sp-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
    </style>
  </head>
  <body>
    <!-- Instant splash shown before any JS loads -->
    <div id="splash">
      <div class="splash-shell">
        <div class="splash-brand">
          <div class="splash-logo-wrap">
            <img class="splash-logo-img" src="/logo.png" alt="Callsflow logo" />
          </div>
          <div class="splash-copy">
            <p class="splash-title">CALLSFLOW</p>
            <p class="splash-subtitle">Connecting your workspace...</p>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
