<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
:root {
  --text-primary: #f6efe8;
  --text-secondary: #b7a79a;
  --text-tertiary: #8a7a6e;
  --brand-text: #ff8a65;
  --brand-solid: #e07050;
  --brand-on: #1a0c08;
  --glass-border: rgba(255,255,255,0.12);
  --surface-container-high: #2a1c16;
  --radius-lg: 14px;
  --radius-full: 999px;
}
* { box-sizing: border-box; }
body { margin: 0; background: #140c0a; color: var(--text-primary); font-family: Inter, system-ui, sans-serif; }
.shell { display:flex; height:100vh; }
.sidebar { width: 220px; background:#120a08; border-right:1px solid var(--glass-border); padding:18px; }
.main { flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar { height:56px; border-bottom:1px solid var(--glass-border); display:flex; align-items:center; padding:0 24px; color:var(--text-secondary); }
.page {
  display:flex; flex-direction:column; flex:1; min-height:0; gap:16px; padding:24px 28px 20px;
}
.header { display:flex; justify-content:space-between; align-items:flex-start; }
.lead { display:flex; align-items:center; gap:16px; }
.icon { width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(224,112,80,.14);border:1px solid rgba(224,112,80,.22);color:var(--brand-text); }
h2 { margin:0 0 4px; font-size:20px; }
.lead p { margin:0; color:var(--text-secondary); font-size:14px; }
.sla { padding:6px 10px; border-radius:999px; border:1px solid var(--glass-border); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-secondary); }
.switcher { display:inline-flex; gap:4px; padding:4px; border-radius:999px; border:1px solid var(--glass-border); }
.switcher span { padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700; color:var(--text-secondary); }
.switcher .on { background:var(--brand-solid); color:var(--brand-on); }
.glass { border:1px solid var(--glass-border); border-radius:18px; background:rgba(42,24,20,.72); flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
.head { padding:18px 22px 16px; border-bottom:1px solid var(--glass-border); }
.head h3 { margin:0 0 4px; font-size:15px; }
.head p { margin:0; color:var(--text-secondary); font-size:13px; }
.body { flex:1; min-height:0; padding:20px 22px 16px; display:flex; flex-direction:column; gap:16px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
label { font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text-secondary); display:block; margin-bottom:6px; }
input, textarea, .select {
  width:100%; background:rgba(42,24,20,.8); border:1px solid var(--glass-border); border-radius:14px; padding:10px 14px; color:var(--text-primary); font:inherit; min-height:42px;
}
.desc { flex:1; display:flex; flex-direction:column; min-height:180px; }
textarea { flex:1; min-height:180px; resize:none; }
.footer { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 22px 16px; border-top:1px solid var(--glass-border); }
.attach { display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:14px; border:1px dashed var(--glass-border); color:var(--text-secondary); font-size:13px; font-weight:600; }
.send { min-height:44px; min-width:148px; padding:0 22px; border:none; border-radius:14px; background:var(--brand-solid); color:var(--brand-on); font-weight:700; }
.hint { font-size:11px; color:var(--text-tertiary); font-weight:500; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">Support</aside>
  <div class="main">
    <div class="topbar">Support › Email</div>
    <div class="page">
      <div class="header">
        <div class="lead">
          <div class="icon">✉</div>
          <div>
            <h2>Email support</h2>
            <p>Send a ticket and we will reply to your inbox within 24 hours.</p>
          </div>
          <span class="sla">Replies in 24h</span>
        </div>
        <nav class="switcher"><span>Live chat</span><span class="on">Email</span></nav>
      </div>
      <div class="glass">
        <div class="head"><h3>New ticket</h3><p>We read every email. Attach screenshots if it helps.</p></div>
        <div class="body">
          <div class="grid">
            <div><label>Subject</label><input placeholder="Brief summary" /></div>
            <div><label>Category</label><div class="select">Select a category</div></div>
          </div>
          <div class="desc"><label>Description</label><textarea placeholder="Describe your issue..."></textarea></div>
        </div>
        <div class="footer">
          <div class="attach">📎 Add files <span class="hint">up to 5</span></div>
          <button class="send">Send email</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
