<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
:root {
  --text-primary:#e8f0e8; --text-secondary:#8aa08a; --text-tertiary:#6a7f6a;
  --brand-text:#6dff8a; --brand-solid:#2f9e4b; --brand-on:#04140a;
  --glass-border:rgba(255,255,255,.12); --surface-container-high:#16301c;
}
html,body{height:100%;margin:0;background:#07140c;color:var(--text-primary);font-family:system-ui,sans-serif}
.thread{display:flex;flex-direction:column;height:100vh}
.messageList{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.messageListInner{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:2px;padding:16px}
.daySep{align-self:stretch;display:flex;justify-content:center;margin:10px 0 8px}
.daySep span{font-size:12px;font-weight:600;color:var(--text-secondary);background:rgba(22,48,28,.88);border-radius:8px;padding:5px 12px}
.row{display:flex;max-width:70%;margin-top:8px}
.row.stacked{margin-top:0}
.bot{align-self:flex-start}
.user{align-self:flex-end}
.bubble{padding:8px 10px;border-radius:12px;font-size:14px}
.bot .bubble{background:#1c3322}
.user .bubble{background:var(--brand-solid);color:var(--brand-on)}
.clusterEnd.bot .bubble{border-bottom-left-radius:4px}
.clusterEnd.user .bubble{border-bottom-right-radius:4px}
.composer{padding:12px;border-top:1px solid var(--glass-border)}
</style>
</head>
<body>
<div class="thread">
  <div class="messageList">
    <div class="messageListInner">
      <div class="daySep"><span>Yesterday</span></div>
      <div class="row bot clusterEnd"><div class="bubble">hi from yesterday</div></div>
      <div class="row user clusterEnd"><div class="bubble">reply yesterday</div></div>
      <div class="daySep"><span>Today</span></div>
      <div class="row bot"><div class="bubble">today 1</div></div>
      <div class="row bot stacked clusterEnd"><div class="bubble">today 2</div></div>
      <div class="row user clusterEnd"><div class="bubble">today mine</div></div>
    </div>
  </div>
  <div class="composer">composer</div>
</div>
</body>
</html>
