<!doctype html>
<html><head><meta charset="utf-8"/><style>
:root{--topbar-height:56px;--text-primary:#f2f7f2;--text-secondary:#9bb09b;--text-tertiary:#6f856f;--brand-text:#6dff8a;--brand-solid:#2f9e4b;--brand-on:#04140a;--accent-yellow:#f5c84c;--glass-border:rgba(255,255,255,.12);--surface-container-high:#16301c;--radius-md:10px;--radius-lg:14px;--radius-full:999px}
body{margin:0;background:#07140c;color:var(--text-primary);font-family:Inter,system-ui,sans-serif}
.glass{border:1px solid var(--glass-border);border-radius:18px;background:rgba(18,40,24,.72)}
/* Featurebase / Intercom-style messenger desk — not a bento */

.page {
  display: flex;
  flex-direction: column;
  height: calc(100dvh - var(--topbar-height) - 120px);
  min-height: 560px;
}

.shell {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
  overflow: hidden;
  padding: 0;
}

.inbox,
.chatPane {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.inbox {
  border-right: 1px solid var(--glass-border);
  background: color-mix(in srgb, var(--surface-container-high) 28%, transparent);
}

.inboxHead {
  padding: 16px 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex-shrink: 0;
}

.inboxTitleRow {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--brand-text);
}

.inboxTitleRow h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

.statPills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.pill,
.pillMuted {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: var(--radius-full);
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text-secondary);
  border: 1px solid var(--glass-border);
  background: color-mix(in srgb, var(--surface-container-high) 50%, transparent);
}

.pill {
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 600;
}

.pill strong {
  color: var(--text-primary);
  font-weight: 800;
}

.pillActive {
  border-color: color-mix(in srgb, var(--brand-text) 40%, var(--glass-border));
  background: color-mix(in srgb, var(--brand-text) 12%, transparent);
  color: var(--text-primary);
}

.pillWarn strong {
  color: var(--accent-yellow);
}

.pillMuted {
  border-style: dashed;
  cursor: default;
}

.tabs {
  display: flex;
  gap: 2px;
  padding: 0 10px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--glass-border);
}

.tab {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 10px 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  border-radius: 0;
}

.tabActive {
  color: var(--text-primary);
  border-bottom-color: var(--brand-text);
}

.tabBadge {
  min-width: 16px;
  height: 16px;
  padding: 0 5px;
  border-radius: var(--radius-full);
  background: var(--accent-yellow);
  color: #1a1400;
  font-size: 10px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.searchWrap {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 10px 12px;
  padding: 0 10px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--glass-border);
  background: color-mix(in srgb, var(--surface-container-high) 70%, transparent);
  color: var(--text-tertiary);
  flex-shrink: 0;
}

.search {
  flex: 1;
  border: none;
  background: transparent;
  padding: 9px 0;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  min-width: 0;
}

.search::placeholder {
  color: var(--text-tertiary);
}

.list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 4px 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 10px;
  border-radius: var(--radius-lg);
  border: 1px solid transparent;
  background: transparent;
  color: inherit;
  cursor: pointer;
  width: 100%;
}

.row:hover {
  background: color-mix(in srgb, var(--brand-text) 7%, transparent);
}

.rowActive {
  border-color: color-mix(in srgb, var(--brand-text) 35%, transparent);
  background: color-mix(in srgb, var(--brand-text) 10%, transparent);
}

.rowAvatar {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--brand-text);
  background: color-mix(in srgb, var(--brand-text) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--brand-text) 22%, transparent);
}

.rowBody {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rowTop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.rowName {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rowTime {
  font-size: 11px;
  color: var(--text-tertiary);
  flex-shrink: 0;
}

.rowPreview {
  font-size: 12px;
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.unread {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-full);
  background: var(--brand-text);
  flex-shrink: 0;
}

.emptyList {
  margin: 32px 16px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1.5;
}

/* Dominant chat pane */
.chatPane {
  background: transparent;
}

.chatMeta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--glass-border);
  flex-shrink: 0;
}

.chatMetaLeft {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.chatAvatar {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  color: var(--brand-on);
  background: var(--brand-solid);
  flex-shrink: 0;
}

.chatName {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chatSub {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chatActions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.threadWrap {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.emptyChat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 32px;
  gap: 10px;
}

.emptyIcon {
  width: 56px;
  height: 56px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brand-text);
  background: color-mix(in srgb, var(--brand-text) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--brand-text) 22%, transparent);
  margin-bottom: 8px;
}

.emptyTitle {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text-primary);
}

.emptyCopy {
  margin: 0;
  max-width: 36ch;
  font-size: 14px;
  line-height: 1.55;
  color: var(--text-secondary);
}

.emptyCta {
  margin-top: 8px;
  border: none;
  border-radius: var(--radius-full);
  padding: 8px 16px;
  background: var(--brand-solid);
  color: var(--brand-on);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.emptyCta:hover {
  filter: brightness(1.08);
}

@media (max-width: 900px) {
  .shell {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(240px, 38%) 1fr;
  }

  .inbox {
    border-right: none;
    border-bottom: 1px solid var(--glass-border);
  }
}

@media (max-width: 560px) {
  .shell {
    grid-template-rows: minmax(200px, 34%) 1fr;
  }

  .chatMeta {
    flex-wrap: wrap;
  }
}
</style></head><body>
<div class="page" style="height:100vh;padding:16px;box-sizing:border-box">
  <div class="glass shell">
    <aside class="inbox">
      <div class="inboxHead">
        <div class="inboxTitleRow"><h2>Inbox</h2></div>
        <div class="statPills">
          <button class="pill pillWarn pillActive">Waiting <strong>1</strong></button>
          <button class="pill">Open <strong>2</strong></button>
          <span class="pillMuted">Avg 17m</span>
        </div>
      </div>
      <div class="tabs"><button class="tab tabActive">waiting</button><button class="tab">mine</button><button class="tab">closed</button></div>
      <label class="searchWrap"><input class="search" placeholder="Search conversations"/></label>
      <div class="list">
        <button class="row rowActive"><span class="rowAvatar">A</span><span class="rowBody"><span class="rowTop"><span class="rowName">Arham</span><span class="rowTime">9m</span></span><span class="rowPreview">Hello</span></span></button>
      </div>
    </aside>
    <section class="chatPane">
      <div class="chatMeta"><div class="chatMetaLeft"><span class="chatAvatar">A</span><div><p class="chatName">Arham</p><p class="chatSub">Unassigned</p></div></div></div>
      <div class="threadWrap" style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-secondary)">Chat thread</div>
    </section>
  </div>
</div>
</body></html>
